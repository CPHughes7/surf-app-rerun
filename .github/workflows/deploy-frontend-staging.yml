name: Deploy frontend to staging (S3)

on:
  push:
    branches: [dev/rebuild]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-staging.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_NDBC_URL: https://lake-surf-api-staging.fly.dev/api/ndbc/latest_obs.txt
          VITE_API_URL: https://lake-surf-api-staging.fly.dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Idempotent: only actually creates anything the first time this runs.
      # Never touches the production bucket (secrets.S3_BUCKET) — separate
      # bucket, separate name, on purpose.
      - name: Ensure the staging bucket exists and serves as a static site
        run: |
          BUCKET="${{ secrets.S3_BUCKET_STAGING }}"
          REGION="${{ secrets.AWS_REGION }}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating staging bucket $BUCKET in $REGION"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
              "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"
            aws s3 website "s3://$BUCKET/" --index-document index.html --error-document index.html
            aws s3api put-bucket-policy --bucket "$BUCKET" --policy '{
              "Version": "2012-10-17",
              "Statement": [{
                "Sid": "PublicReadStaging",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::'"$BUCKET"'/*"
              }]
            }'
          fi

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_STAGING }} --delete
